<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video URL Downloader</title>
    <meta name="description" content="Fast and versatile web application to inspect, preview, and download videos directly from any URL with custom naming and format detection." />
    <meta property="og:title" content="Video URL Downloader" />
    <meta property="og:description" content="Fast and versatile web application to inspect, preview, and download videos directly from any URL with custom naming and format detection." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Fallback: If deployed to GitHub Pages root / instead of /docs, automatically route to /docs/
      if (window.location.hostname.includes('github.io') && !window.location.pathname.includes('/docs/')) {
        var base = window.location.pathname.replace(/\/+$/, '');
        window.location.replace(base + '/docs/' + window.location.search + window.location.hash);
      }
    </script>
    <script type="module" crossorigin src="./assets/app.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/app.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
