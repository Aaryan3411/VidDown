name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build APK
        working-directory: ./mobile_app
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viddown-mobile-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release (on tag or manual dispatch)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.0-${{ github.run_number }}
          name: "VidDown Mobile APK v1.0.${{ github.run_number }}"
          body: "Automated Android release build for VidDown Mobile App. Download app-release.apk and install on your phone."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
